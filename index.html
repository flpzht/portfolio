    <meta name="theme-color" content="#3e3239" />
    <script>
      // Aplica o tema antes da primeira pintura, evitando o flash:
      // usa a escolha salva e, sem ela, a preferência do sistema.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          }
        } catch (e) {}
        document.documentElement.classList.add(theme);
        if (theme === 'light') {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#f7efe7');
        }
      })();
    </script>
